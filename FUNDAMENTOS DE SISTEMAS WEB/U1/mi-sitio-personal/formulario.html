
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>

    <h1>Formulario personal</h1>

    <nav>
        <a href="index.html">Inicio</a> <br>
        <a href="sobre-mi.html">Sobre mí</a> <br>
        <a href="pasatiempos.html">Pasatiempos</a> <br>
        <a href="multimedia.html">Multimedia</a> <br>
        <a href="formulario.html">Formulario</a>
    </nav>

    <hr>

    <h2>Ingresa tus datos</h2>

    <form action="formulario.html" method="get">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"
               placeholder="Tu nombre"
               minlength="3" maxlength="50" required>

        <br><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo"
               placeholder="Tu correo" required>

        <br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad"
               min="1" max="100" required>

        <br><br>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>

        <h3>Pasatiempos</h3>

        <input type="checkbox" id="musica"
               name="pasatiempo" value="musica">
        <label for="musica">Música</label>

        <br>

        <input type="checkbox" id="futbol"
               name="pasatiempo" value="futbol">
        <label for="futbol">Fútbol</label>

        <br>

        <input type="checkbox" id="juegos"
               name="pasatiempo" value="videojuegos">
        <label for="juegos">Videojuegos</label>

        <h3>Género</h3>

        <input type="radio" id="masculino"
               name="genero" value="masculino" required>
        <label for="masculino">Masculino</label>

        <input type="radio" id="femenino"
               name="genero" value="femenino">
        <label for="femenino">Femenino</label>

        <h3>Carrera</h3>

        <label for="carrera">Selecciona tu carrera:</label>

        <select id="carrera" name="carrera" required>
            <option value="">Seleccionar</option>
            <option value="ti">Tecnologías de la Información</option>
            <option value="software">Software</option>
            <option value="otras">Otra</option>
        </select>

        <h3>Comentarios</h3>

        <label for="comentario">Tu comentario:</label>
        <br>

        <textarea id="comentario" name="comentario"
                  rows="4" cols="30"
                  maxlength="200"></textarea>

        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>

    </form>

    <p>Formulario de práctica, sin almacenamiento de datos.</p>

</body>
</html>
